---
# Configuration for infra server (backs up to primary)

server_role: infra

# Sensitive backup variables are stored in host_vars/infra/vault.yml:
# - backup_target_host
# - backup_target_dir
# - backup_paths (optional: extra paths outside backup_root)

# Every subdirectory of backup_root is backed up automatically (discovered
# when the backup script runs), so new apps need no config change.
# Set backup_root to "" to disable discovery and use backup_paths only.
backup_root: /storage/apps

# Directory names under backup_root to skip (backup and restore)
backup_exclude: []

# Backup schedule (cron format)
backup_cron_minute: "0"
backup_cron_hour: "3"
backup_cron_day: "*"
enable_backup_cron: true

# Rsync options
backup_rsync_opts: "-avz --delete --progress --numeric-ids"

# Optional explicit compose dirs for infra_restore stop/start.
# Empty list = auto-discover compose.yaml under backup_root.
infra_restore_compose_dirs: []
# Example:
# infra_restore_compose_dirs:
#   - /storage/apps/homeassistant
#   - /storage/apps/pihole_unbound
#   - /storage/apps/unifi-network
#   - /storage/apps/nginx-proxy-manager
#   - /storage/apps/trading_log
#   - /storage/apps/sh_webshop
#   - /storage/apps/sh_portal
