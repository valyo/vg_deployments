---
# Configuration for infra server (backs up to primary)

server_role: infra

# Sensitive backup path variables are stored in host_vars/infra/vault.yml:
# - backup_target_dir
# - backup_paths

# Backup schedule (cron format)
backup_cron_minute: "0"
backup_cron_hour: "3"
backup_cron_day: "*"
enable_backup_cron: true

# Rsync options
backup_rsync_opts: "-avz --delete --progress --numeric-ids"

# Optional explicit compose dirs for infra_restore stop/start.
# Empty list = auto-discover compose.yaml under restore paths.
infra_restore_compose_dirs: []
# Example:
# infra_restore_compose_dirs:
#   - /storage/apps/homeassistant
#   - /storage/apps/pihole_unbound
#   - /storage/apps/unifi-network
#   - /storage/apps/nginx-proxy-manager
#   - /storage/apps/trading_log
#   - /storage/apps/sh_webshop
#   - /storage/apps/sh_portal
