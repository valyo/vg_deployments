---
# tasks file for samba
- name: Validate Samba share paths do not overlap
  ansible.builtin.assert:
    that:
      - SHARE_1_PATH != SHARE_2_PATH
      - not SHARE_2_PATH.startswith(SHARE_1_PATH + '/')
      - not SHARE_1_PATH.startswith(SHARE_2_PATH + '/')
    fail_msg: >-
      SHARE_1_PATH ({{ SHARE_1_PATH }}) and SHARE_2_PATH ({{ SHARE_2_PATH }})
      must be distinct and non-nested.
  tags:
    - copy

- name: Check Samba host bind paths exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: samba_bind_paths
  loop:
    - "{{ SAMBA_1_PATH }}"
    - "{{ SAMBA_2_PATH }}"
  tags:
    - copy

- name: Fail if Samba host bind path is missing
  ansible.builtin.fail:
    msg: "Samba bind source path missing on host: {{ item.item }}"
  when: not (item.stat.exists | default(false))
  loop: "{{ samba_bind_paths.results }}"
  tags:
    - copy

- name: ensure workdir exists
  ansible.builtin.file:
    path: "{{ WORKDIR }}"
    state: directory
    mode: '0755'
  tags:
    - copy

- name: copy docker compose files
  copy:
    src: "{{ item }}"
    dest: "{{ WORKDIR }}"
  loop:
  - compose.yml
  tags:
    - copy

- name: copy .env from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ WORKDIR }}/.env"
  tags:
    - copy

- name: copy smb.conf from template
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ WORKDIR }}/smb.conf"
  tags:
    - copy

- name: deploy the stack
  ansible.builtin.shell: "docker compose up -d"
  args:
    chdir: "{{ WORKDIR }}"
  tags:
    - up

- name: tear down the stack
  ansible.builtin.shell: "docker compose down"
  args:
    chdir: "{{ WORKDIR }}"
  tags:
    - down

- name: pull image
  ansible.builtin.shell: "docker compose pull"
  args:
    chdir: "{{ WORKDIR }}"
  tags:
    - pull

- name: recreate the stack
  ansible.builtin.shell: "docker compose up -d --force-recreate"
  args:
    chdir: "{{ WORKDIR }}"
  tags:
    - restart

- name: Retrieve host vars
  debug:
    var=ansible_facts['default_ipv4']['interface']
  tags:
   - test
