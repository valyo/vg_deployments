---
# tasks file for sh_portal
- name: Ensure workdir exists
  ansible.builtin.file:
    path: "{{ workdir }}"
    state: directory
    mode: '0755'
  tags:
    - copy

- name: Ensure SH Portal data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ sh_portal_env.SH_PORTAL_UID }}"
    group: "{{ sh_portal_env.SH_PORTAL_GID }}"
  loop:
    - "{{ workdir }}/data"
    - "{{ workdir }}/data/credentials"
    - "{{ workdir }}/data/instance"
    - "{{ workdir }}/data/invoices"
    - "{{ workdir }}/data/certificates"
  tags:
    - copy

- name: Copy docker compose file
  ansible.builtin.copy:
    src: docker-compose.yaml
    dest: "{{ workdir }}/docker-compose.yaml"
  tags:
    - copy

- name: Generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workdir }}/.env"
    mode: '0600'
  tags:
    - copy

- name: Copy Google sheet credentials file to app credentials directory
  ansible.builtin.copy:
    src: service-account.json
    dest: "{{ workdir }}/data/credentials/service-account.json"
    mode: '0600'
  tags: 
    - copy

- name: Seed SH Portal database file (optional)
  ansible.builtin.copy:
    src: "{{ sh_portal_seed_db_file }}"
    dest: "{{ workdir }}/data/instance/{{ sh_portal_env.DB_NAME }}"
    mode: '0644'
  when: sh_portal_seed_db_file | default('') | length > 0
  tags:
    - copy

- name: Deploy the stack
  ansible.builtin.shell: "docker compose up -d"
  args:
    chdir: "{{ workdir }}"
  tags:
    - up

- name: Tear down the stack
  ansible.builtin.shell: "docker compose down"
  args:
    chdir: "{{ workdir }}"
  tags:
    - down

- name: Pull image
  ansible.builtin.shell: "docker compose pull"
  args:
    chdir: "{{ workdir }}"
  tags:
    - pull

- name: Recreate the stack
  ansible.builtin.shell: "docker compose up -d --force-recreate"
  args:
    chdir: "{{ workdir }}"
  tags:
    - restart
