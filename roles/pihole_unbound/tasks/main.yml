---
# tasks file for pihole_unbound

- name: ensure workdir exists
  ansible.builtin.file:
    path: "{{ workdir }}"
    state: directory
    mode: '0755'
  tags:
    - copy

- name: ensure pihole data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ pihole_dir_owner }}"
    group: "{{ pihole_dir_group }}"
  loop:
    - "{{ pihole_data_root }}/pihole"
    - "{{ pihole_data_root }}/dnsmasq.d"
  become: true
  tags:
    - copy

- name: copy docker compose files
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ workdir }}"
  tags:
    - copy

# --- Host macvlan (needed before compose creates the docker macvlan network) ---

- name: Get the macvlan parent interface
  ansible.builtin.set_fact:
    macvlan_parent: "{{ ansible_facts['default_ipv4']['interface'] }}"
  tags:
    - macvlan
    - copy
    - up

- name: Prefer vault DOCKER_HOST_NIC when set (e.g. VLAN subinterface like eth0.10)
  ansible.builtin.set_fact:
    macvlan_parent: "{{ pihole_env.DOCKER_HOST_NIC }}"
  when:
    - pihole_env.DOCKER_HOST_NIC is defined
    - pihole_env.DOCKER_HOST_NIC | length > 0
    - "'.' in pihole_env.DOCKER_HOST_NIC"
  tags:
    - macvlan
    - copy
    - up

- name: Show the selected macvlan parent interface
  ansible.builtin.debug:
    msg: "Selected macvlan_parent: {{ macvlan_parent }}"
  tags:
    - macvlan
    - copy
    - up

- name: Create macvlan interface (ip + systemd for Ubuntu Server)
  ansible.builtin.template:
    src: macvlan-setup.sh.j2
    dest: "/usr/local/bin/macvlan-{{ macvlan_name }}.sh"
    mode: '0755'
  become: true
  tags:
    - macvlan

- name: Install systemd service for macvlan at boot
  ansible.builtin.template:
    src: macvlan.service.j2
    dest: "/etc/systemd/system/macvlan-{{ macvlan_name }}.service"
  become: true
  tags:
    - macvlan

- name: Run macvlan setup and enable at boot
  block:
    - name: Run macvlan setup script
      ansible.builtin.command: "/usr/local/bin/macvlan-{{ macvlan_name }}.sh"
      changed_when: true
    - name: Reload systemd and enable macvlan service
      ansible.builtin.systemd:
        name: "macvlan-{{ macvlan_name }}"
        daemon_reload: true
        enabled: true
        state: started
  become: true
  tags:
    - macvlan

# --- Compose env + deploy (after parent NIC is known) ---

- name: generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workdir }}/.env"
    mode: '0600'
  tags:
    - copy

- name: deploy the stack
  ansible.builtin.shell: "docker compose up -d"
  args:
    chdir: "{{ workdir }}"
  tags:
    - up

- name: tear down the stack
  ansible.builtin.shell: "docker compose down"
  args:
    chdir: "{{ workdir }}"
  tags:
    - never
    - down

- name: pull image
  ansible.builtin.shell: "docker compose pull"
  args:
    chdir: "{{ workdir }}"
  tags:
    - never
    - pull

- name: recreate the stack
  ansible.builtin.shell: "docker compose up -d --force-recreate"
  args:
    chdir: "{{ workdir }}"
  tags:
    - never
    - restart
