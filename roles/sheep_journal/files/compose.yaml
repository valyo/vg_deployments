---
services:
  app:
    container_name: sheep_journal
    image: ghcr.io/valyo/sheep-journal:${IMAGE_VERSION}
    user: "${SHEEP_JOURNAL_UID}:${SHEEP_JOURNAL_GID}"
    restart: unless-stopped
    ports:
      - "${PORT}:8000"
    volumes:
      # SQLite database (sheep_journal.sqlite), animal photos (uploads/) and import reports
      - ./data/instance:/app/instance
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SHEEP_JOURNAL_TZ=${SHEEP_JOURNAL_TZ}
    healthcheck:
      # The image has no curl/wget; use Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
