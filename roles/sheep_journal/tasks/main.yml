---
# tasks file for sheep_journal
- name: Check that SECRET_KEY is set
  ansible.builtin.assert:
    that:
      - sheep_journal_env.SECRET_KEY is defined
      - sheep_journal_env.SECRET_KEY | length >= 32
      - "'set-in-vault' not in sheep_journal_env.SECRET_KEY"
    fail_msg: "Set sheep_journal_env.SECRET_KEY (at least 32 random characters) in the Vault-encrypted vars."
    quiet: true
  tags:
    - copy

- name: Ensure workdir exists
  ansible.builtin.file:
    path: "{{ workdir }}"
    state: directory
    mode: "0755"
  tags:
    - copy

- name: Ensure Sheep Journal data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ sheep_journal_env.SHEEP_JOURNAL_UID }}"
    group: "{{ sheep_journal_env.SHEEP_JOURNAL_GID }}"
  loop:
    - "{{ workdir }}/data"
    - "{{ workdir }}/data/instance"
    - "{{ workdir }}/data/instance/uploads"
  tags:
    - copy

- name: Copy compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ workdir }}/compose.yaml"
  tags:
    - copy

- name: Generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workdir }}/.env"
    mode: "0600"
  tags:
    - copy

# Only copied when no database exists yet, so a later run never overwrites live data.
- name: Seed Sheep Journal database file (optional)
  ansible.builtin.copy:
    src: "{{ sheep_journal_seed_db_file }}"
    dest: "{{ workdir }}/data/instance/sheep_journal.sqlite"
    mode: "0640"
    owner: "{{ sheep_journal_env.SHEEP_JOURNAL_UID }}"
    group: "{{ sheep_journal_env.SHEEP_JOURNAL_GID }}"
    force: false
  when: sheep_journal_seed_db_file | default("") | length > 0
  tags:
    - copy

- name: Deploy the stack
  ansible.builtin.shell: "docker compose up -d"
  args:
    chdir: "{{ workdir }}"
  tags:
    - up

- name: Tear down the stack
  ansible.builtin.shell: "docker compose down"
  args:
    chdir: "{{ workdir }}"
  tags:
    - down

- name: Pull image
  ansible.builtin.shell: "docker compose pull"
  args:
    chdir: "{{ workdir }}"
  tags:
    - pull

- name: Recreate the stack
  ansible.builtin.shell: "docker compose up -d --force-recreate"
  args:
    chdir: "{{ workdir }}"
  tags:
    - restart
