---
# tasks file for homeassistant
- name: Ensure workdir exists
  ansible.builtin.file:
    path: "{{ workdir }}"
    state: directory
    mode: '0755'
  tags:
    - copy

- name: Ensure Home Assistant config directory exists
  ansible.builtin.file:
    path: "{{ workdir }}/ha_config"
    state: directory
    mode: '0755'
    owner: "{{ homeassistant_env.HOMEASSISTANT_UID }}"
    group: "{{ homeassistant_env.HOMEASSISTANT_GID }}"
  tags:
    - copy

- name: Set up VLAN 30 interface for macvlan parent (only when host has VLAN 30)
  block:
    - name: Detect physical NIC for VLAN 30 (from existing *.30 interface or default route)
      ansible.builtin.set_fact:
        homeassistant_vlan30_physical_nic: >-
          {{ homeassistant_vlan30_physical_nic | default(
            (ansible_interfaces | select('match', '.*\\.30$') | list | first) | default('', true) | regex_replace('\\.30$', '')
            or ansible_default_ipv4.interface | default('', true),
            true
          ) }}
      when: ansible_interfaces is defined

    - name: Fail if physical NIC for VLAN 30 could not be detected
      ansible.builtin.fail:
        msg: "Could not detect physical NIC for VLAN 30. Set homeassistant_vlan30_physical_nic in host/group vars (e.g. enp2s0)."
      when: not (homeassistant_vlan30_physical_nic | length)

    - name: Install VLAN 30 setup script
      ansible.builtin.template:
        src: vlan30-setup.sh.j2
        dest: /usr/local/bin/vlan30-homeassistant.sh
        mode: '0755'
      become: true

    - name: Install systemd service for VLAN 30 at boot
      ansible.builtin.template:
        src: vlan30.service.j2
        dest: /etc/systemd/system/vlan30-homeassistant.service
      become: true

    - name: Create VLAN 30 interface and enable at boot
      block:
        - name: Run VLAN 30 setup script
          ansible.builtin.command: /usr/local/bin/vlan30-homeassistant.sh
          become: true
          changed_when: true
        - name: Reload systemd and enable vlan30-homeassistant service
          ansible.builtin.systemd:
            name: vlan30-homeassistant
            daemon_reload: true
            enabled: true
            state: started
      become: true

    - name: Set VLAN 30 parent interface fact for Docker macvlan
      ansible.builtin.set_fact:
        homeassistant_vlan30_parent: "{{ homeassistant_vlan30_physical_nic }}.{{ homeassistant_vlan30_id }}"
  when: homeassistant_use_vlan30 | default(true) | bool

- name: Copy docker compose files
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ workdir }}"
  tags:
    - copy

- name: Generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workdir }}/.env"
    mode: '0600'
  tags:
    - copy

- name: Deploy the stack
  ansible.builtin.shell: "docker compose up -d"
  args:
    chdir: "{{ workdir }}"
  tags:
    - up

- name: Tear down the stack
  ansible.builtin.shell: "docker compose down"
  args:
    chdir: "{{ workdir }}"
  tags:
    - never
    - upgrade
    - down

- name: Pull image
  ansible.builtin.shell: "docker compose pull"
  args:
    chdir: "{{ workdir }}"
  tags:
    - never
    - upgrade
    - pull

- name: Recreate the stack
  ansible.builtin.shell: "docker compose up -d --force-recreate"
  args:
    chdir: "{{ workdir }}"
  tags:
    - restart
