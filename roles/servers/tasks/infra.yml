---
# Tasks for infra server (laptop)

- name: Ignore lid close events
  lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: HandleLidSwitch, value: ignore }
    - { key: HandleLidSwitchExternalPower, value: ignore }
    - { key: HandleLidSwitchDocked, value: ignore }
  notify: restart logind
  tags:
    - infra
    - laptop

- name: Set console blank timeout in GRUB
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="consoleblank=60"'
  register: grub_default
  tags:
    - infra
    - laptop

- name: Update GRUB after default cmdline change
  ansible.builtin.command: update-grub
  when: grub_default is changed
  tags:
    - infra
    - laptop

- name: Ensure /storage is owned by local user
  file:
    path: /storage
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  tags:
    - infra
    - deployments

- name: Create apps directory on persistent storage
  file:
    path: /storage/apps
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  tags:
    - backup
    - deployments

- name: Install cron
  apt:
    pkg:
      - cron
  tags:
    - backup

- name: Validate required backup variables are defined
  ansible.builtin.assert:
    that:
      - backup_target_dir is defined
      - backup_target_dir | length > 0
      - backup_paths is defined
      - backup_paths | length > 0
    fail_msg: >-
      Define backup_target_dir and backup_paths in encrypted host vars
      (inventory/host_vars/infra/vault.yml) before running backup tasks.
  tags:
    - backup

- name: Deploy backup script
  template:
    src: backup_to_burkeng.sh.j2
    dest: /usr/local/bin/backup_to_burkeng.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - backup

- name: Allow user to run rsync via sudo for backups
  copy:
    content: |
      {{ local_user }} ALL=(root) NOPASSWD: /usr/bin/rsync, /bin/rsync
    dest: /etc/sudoers.d/backup-rsync
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - backup

- name: Setup backup cron job
  cron:
    name: "Backup to primary server"
    minute: "{{ backup_cron_minute | default('15') }}"
    hour: "{{ backup_cron_hour | default('3') }}"
    day: "{{ backup_cron_day | default('*') }}"
    job: "/usr/local/bin/backup_to_burkeng.sh >> /var/log/backup.log 2>&1"
    user: "{{ local_user }}"
    state: "{{ 'present' if enable_backup_cron | default(true) else 'absent' }}"
  tags:
    - backup

- name: Create backup log file
  file:
    path: /var/log/backup.log
    state: touch
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
  changed_when: false
  tags:
    - backup

- name: Setup log rotation for backup log
  template:
    src: backup.logrotate.j2
    dest: /etc/logrotate.d/backup
    mode: "0644"
  tags:
    - backup
