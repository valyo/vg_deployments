services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:${IMAGE_VERSION}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${ADMIN_PORT}:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK_NAME}
